plugins {
    id 'com.android.application'
}

// The site the app opens. Navigations to any other host are cancelled (see MainActivity).
def siteHost = 'tunisiaflicks.vercel.app'

// Release signing comes from the environment (the android-apps.yml workflow decodes the keystore
// from repository secrets; both apps use the same key). Without it, assembleRelease builds an
// unsigned APK.
def keystorePath = System.getenv('TF_KEYSTORE_PATH')
def signed = keystorePath != null && !keystorePath.isEmpty()

android {
    namespace 'com.tunisiaflicks.tv'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tunisiaflicks.tv'
        // Android 5.0: the oldest Android TV, and most cheap TV boxes.
        minSdk 21
        targetSdk 36
        // The workflow passes the tag's numbers: android-v1.2.3 -> 1.2.3, code 10203.
        versionCode((System.getenv('TF_VERSION_CODE') ?: '1') as int)
        versionName System.getenv('TF_VERSION_NAME') ?: '1.0.0'
        buildConfigField 'String', 'SITE_HOST', "\"${siteHost}\""
        buildConfigField 'String', 'START_URL', "\"https://${siteHost}/?tv=1\""
    }

    signingConfigs {
        if (signed) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('TF_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TF_KEY_ALIAS')
                keyPassword System.getenv('TF_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signed) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewCompat: which WebView the device has, and Safe Browsing on old Android versions.
    // 1.12 is the last release that still supports minSdk 21 (1.13+ needs Android 7).
    implementation 'androidx.webkit:webkit:1.12.1'
}
