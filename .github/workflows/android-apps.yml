# Builds the Android apps (android/: tv and phone) and publishes them as a GitHub Release, which the
# site offers on /app and through /download/android and /download/tv (it finds the newest release
# by itself; see src/lib/app-releases.ts).
#
# Runs only when a tag like android-v1.2.3 is pushed (never on pull requests, so the signing key is
# never exposed to code from a fork). Both apps are signed with the same key. The release notes list
# each APK's SHA-256 and the certificate's, in the format the site reads. Setup: docs/apps.md.
#
# Repository secrets:
# - ANDROID_KEYSTORE_BASE64: the release keystore, base64-encoded
# - ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android apps

on:
  push:
    tags: ['android-v*']

permissions:
  contents: write

concurrency:
  group: android-apps-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^android-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tags must look like android-v1.2.3"
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::Minor and patch go up to 99"
            exit 1
          fi
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Decode the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 repository secret (docs/apps.md)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APKs
        working-directory: android
        env:
          TF_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          TF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TF_VERSION_NAME: ${{ steps.version.outputs.name }}
          TF_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew :tv:assembleRelease :phone:assembleRelease --no-daemon
          cp tv/build/outputs/apk/release/tv-release.apk "$RUNNER_TEMP/tunisiaflicks-tv.apk"
          cp phone/build/outputs/apk/release/phone-release.apk "$RUNNER_TEMP/tunisiaflicks-android.apk"

      - name: Check the signatures and compute the checksums
        id: sums
        run: |
          cd "$RUNNER_TEMP"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in tunisiaflicks-tv.apk tunisiaflicks-android.apk; do "$apksigner" verify --verbose "$apk"; done
          cert=$("$apksigner" verify --print-certs tunisiaflicks-android.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          sha256sum tunisiaflicks-tv.apk tunisiaflicks-android.apk > SHA256SUMS
          echo "tv=$(sha256sum tunisiaflicks-tv.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "android=$(sha256sum tunisiaflicks-android.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "cert=$cert" >> "$GITHUB_OUTPUT"
          rm -f release.jks

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.version.outputs.name }}
          TV_SHA: ${{ steps.sums.outputs.tv }}
          ANDROID_SHA: ${{ steps.sums.outputs.android }}
          CERT_SHA: ${{ steps.sums.outputs.cert }}
        run: |
          # The site reads the three "SHA-256" lines below; keep their format.
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          TunisiaFlicks for Android phones and for Android TV / TV boxes, version $NAME.

          Install: https://tunisiaflicks.vercel.app/app

          - tunisiaflicks-android.apk SHA-256: \`$ANDROID_SHA\`
          - tunisiaflicks-tv.apk SHA-256: \`$TV_SHA\`
          - Signing certificate SHA-256: \`$CERT_SHA\`
          EOF
          gh release create "$TAG" \
            "$RUNNER_TEMP/tunisiaflicks-android.apk" "$RUNNER_TEMP/tunisiaflicks-tv.apk" "$RUNNER_TEMP/SHA256SUMS" \
            --title "Android apps $NAME" --notes-file "$RUNNER_TEMP/notes.md"
