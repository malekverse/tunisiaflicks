# Builds the Android TV app (android-tv/) and publishes it as a GitHub Release.
#
# Runs only when a tag like tv-v1.2.3 is pushed (never on pull requests, so the signing key is
# never exposed to code from a fork). The release gets tunisiaflicks-tv.apk, its SHA-256, and the
# signing certificate's SHA-256 in the notes; /app shows the same values so people can check the
# file before installing it. Setup and releasing: docs/TV.md.
#
# Repository secrets:
# - TV_KEYSTORE_BASE64: the release keystore, base64-encoded
# - TV_KEYSTORE_PASSWORD, TV_KEY_ALIAS, TV_KEY_PASSWORD
name: Android TV app

on:
  push:
    tags: ['tv-v*']

permissions:
  contents: write

concurrency:
  group: android-tv-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^tv-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tags must look like tv-v1.2.3"
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::Minor and patch go up to 99"
            exit 1
          fi
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Decode the keystore
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${TV_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Set the TV_KEYSTORE_BASE64 repository secret (docs/TV.md)"
            exit 1
          fi
          echo "$TV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        working-directory: android-tv
        env:
          TF_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          TF_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
          TF_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
          TF_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
          TF_VERSION_NAME: ${{ steps.version.outputs.name }}
          TF_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/tunisiaflicks-tv.apk"

      - name: Check the signature and compute the checksums
        id: sums
        run: |
          cd "$RUNNER_TEMP"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --verbose tunisiaflicks-tv.apk
          cert=$("$apksigner" verify --print-certs tunisiaflicks-tv.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          sha=$(sha256sum tunisiaflicks-tv.apk | cut -d' ' -f1)
          echo "$sha  tunisiaflicks-tv.apk" > tunisiaflicks-tv.apk.sha256
          echo "apk=$sha" >> "$GITHUB_OUTPUT"
          echo "cert=$cert" >> "$GITHUB_OUTPUT"
          rm -f release.jks

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.version.outputs.name }}
          APK_SHA: ${{ steps.sums.outputs.apk }}
          CERT_SHA: ${{ steps.sums.outputs.cert }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          TunisiaFlicks for Android TV and TV boxes, version $NAME.

          Install: see https://tunisiaflicks.vercel.app/app (the steps, and these same checksums).

          - APK SHA-256: \`$APK_SHA\`
          - Signing certificate SHA-256: \`$CERT_SHA\`
          EOF
          gh release create "$TAG" \
            "$RUNNER_TEMP/tunisiaflicks-tv.apk" "$RUNNER_TEMP/tunisiaflicks-tv.apk.sha256" \
            --title "Android TV app $NAME" --notes-file "$RUNNER_TEMP/notes.md"
