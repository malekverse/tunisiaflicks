# Lint, type-check, unit tests, build, then start the app against a throwaway MongoDB and run the
# smoke tests. Free on GitHub Actions. Add a TMDB_API_KEY repository secret to also smoke-test the
# TMDB pages. A second job tests the local player (player-service/) and syntax-checks the desktop
# app, so a dependency bump can't quietly break playback.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      MONGODB_URI: mongodb://localhost:27017/tunisiaflicks_ci
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      # Test-only values (40 characters, like the real ones); never used outside CI.
      CRON_SECRET: ci-test-cron-secret-not-for-production-1
      EMAIL_TOKEN_SECRET: ci-test-mail-token-not-for-production-01
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 runs the TypeScript unit tests natively (type stripping).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Translations
        run: npm run check:i18n
      - run: npm run build
      - name: Start the app
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/robots.txt && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Smoke tests
        run: npm run test:smoke
      - name: Server log
        if: failure()
        run: cat server.log

  player:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: player-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: player-service/package-lock.json
      - run: npm ci
      - name: Syntax-check the player and the desktop app
        run: for f in *.js ../desktop/*.js; do node --check "$f"; done
      # Unit tests (pure logic) + the ffmpeg pipeline on synthesized MKV/HEVC/AC3 files. No network,
      # no swarm. (test-cast.mjs needs a LAN and real peers, so it stays a manual `npm run test:cast`.)
      - name: Player tests
        run: npm test
