<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TunisiaFlicks Player</title>
<style>
  :root { color-scheme: dark; --red: #e50f05; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d0c0f; color: #fff; min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px);
    background: rgba(13,12,15,.82); border-bottom: 1px solid rgba(255,255,255,.07);
    display: flex; align-items: center; gap: 16px; padding: 12px 20px; }
  .brand { font-weight: 800; font-size: 1.15rem; letter-spacing: -.02em; }
  .brand b { color: var(--red); }
  #q { flex: 1; max-width: 520px; padding: 10px 14px; border-radius: 12px;
    border: 1px solid #27272a; background: #1a161f; color: #fff; font-size: .92rem; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px; }
  h2 { font-size: 1rem; color: #cfcfd4; margin: 4px 0 14px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
  .card { cursor: pointer; border: 0; padding: 0; background: none; text-align: start; color: inherit; }
  .poster { position: relative; aspect-ratio: 2/3; border-radius: 12px; overflow: hidden;
    background: #1a161f; box-shadow: 0 8px 24px -12px #000; transition: transform .2s ease; }
  .card:hover .poster { transform: translateY(-4px); }
  .poster img { width: 100%; height: 100%; object-fit: cover; }
  .poster .vote { position: absolute; left: 6px; top: 6px; background: #000a; border-radius: 8px;
    padding: 1px 7px; font-size: .72rem; }
  .meta { margin-top: 6px; }
  .meta .t { font-size: .84rem; font-weight: 600; line-height: 1.2;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta .y { font-size: .74rem; color: #8a8a93; }
  /* Player overlay */
  #overlay { position: fixed; inset: 0; z-index: 50; background: #000e; backdrop-filter: blur(6px);
    display: none; flex-direction: column; }
  #overlay.on { display: flex; }
  .obar { display: flex; align-items: center; gap: 12px; padding: 12px 18px; color: #fff; }
  .obar .ot { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .obar button { background: #ffffff18; border: 0; color: #fff; border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  #video { flex: 1; width: 100%; background: #000; min-height: 0; }
  #ostatus { padding: 0 18px 14px; color: #9ca3af; font-size: .85rem; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #ffffff40;
    border-top-color: #fff; border-radius: 50%; animation: s .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
  details { margin-top: 28px; color: #8a8a93; font-size: .85rem; }
  details input { width: 100%; max-width: 560px; padding: 9px 12px; border-radius: 10px;
    border: 1px solid #27272a; background: #1a161f; color: #fff; margin-top: 8px; }
  .note { color: #6b7280; font-size: .78rem; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <span class="brand">Tunisia<b>Flicks</b> Player</span>
  <input id="q" type="search" placeholder="Search movies to watch locally…" autocomplete="off" />
</header>

<main>
  <h2 id="heading">Trending this week</h2>
  <div class="grid" id="grid"></div>

  <details>
    <summary>Advanced: paste a magnet / infohash</summary>
    <input id="magnet" placeholder="magnet:?xt=urn:btih:…" />
    <p class="note">Streams any torrent you paste. Use only for content you're allowed to stream.</p>
  </details>
</main>

<div id="overlay">
  <div class="obar">
    <div class="ot" id="otitle"></div>
    <button id="oclose">✕ Close</button>
  </div>
  <video id="video" controls autoplay playsinline></video>
  <div id="ostatus"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id)
  const img = (p) => p ? `https://image.tmdb.org/t/p/w342${p}` : ''

  async function loadList(url, heading) {
    $('heading').textContent = heading
    $('grid').innerHTML = ''
    try {
      const data = await (await fetch(url)).json()
      render(data.results || [])
    } catch { $('grid').innerHTML = '<p style="color:#8a8a93">Couldn’t load. Is the player service running?</p>' }
  }

  function render(items) {
    const g = $('grid'); g.innerHTML = ''
    if (!items.length) { g.innerHTML = '<p style="color:#8a8a93">No results.</p>'; return }
    for (const m of items) {
      const b = document.createElement('button')
      b.className = 'card'
      b.innerHTML = `<div class="poster">${m.vote ? `<span class="vote">★ ${m.vote.toFixed(1)}</span>` : ''}${m.poster ? `<img loading="lazy" src="${img(m.poster)}" alt="">` : ''}</div>`
        + `<div class="meta"><div class="t">${m.title}</div><div class="y">${m.year || ''}</div></div>`
      b.onclick = () => playMovie(m)
      g.appendChild(b)
    }
  }

  // --- local playback ---------------------------------------------------------
  function openOverlay(title) {
    $('otitle').textContent = title
    $('ostatus').innerHTML = '<span class="spin"></span>Finding the best source and joining the swarm…'
    $('video').removeAttribute('src')
    $('overlay').classList.add('on')
  }
  function closeOverlay() {
    const v = $('video'); v.pause(); v.removeAttribute('src'); v.load()
    $('overlay').classList.remove('on')
  }
  $('oclose').onclick = closeOverlay
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeOverlay() })

  async function playMovie(m) {
    openOverlay(`${m.title}${m.year ? ` (${m.year})` : ''}`)
    try {
      const r = await fetch(`/resolve?type=movie&tmdb=${m.id}`)
      const d = await r.json()
      if (!r.ok) throw new Error(d.error || 'Could not resolve')
      const how = d.decision === 'direct' ? '' : d.decision === 'remux' ? ' · converting (remux)' : ' · transcoding'
      $('ostatus').textContent = `${d.quality || ''}${how}${d.seekable ? '' : ' · seeking limited'}`
      const v = $('video'); v.src = d.playUrl; v.play().catch(() => {})
    } catch (err) {
      $('ostatus').textContent = 'Error: ' + err.message
    }
  }

  async function playMagnet(magnet) {
    openOverlay('Magnet')
    try {
      const d = await (await fetch('/add?magnet=' + encodeURIComponent(magnet))).json()
      if (!d.best) throw new Error('No playable file')
      $('ostatus').textContent = `${d.name} · ${d.best.decision}`
      const v = $('video'); v.src = d.best.playUrl; v.play().catch(() => {})
    } catch (err) { $('ostatus').textContent = 'Error: ' + err.message }
  }

  // --- search (debounced) -----------------------------------------------------
  let t
  $('q').addEventListener('input', (e) => {
    clearTimeout(t)
    const q = e.target.value.trim()
    t = setTimeout(() => q ? loadList('/api/tmdb/search?q=' + encodeURIComponent(q), `Results for “${q}”`)
                          : loadList('/api/tmdb/trending', 'Trending this week'), 350)
  })
  $('magnet').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.value.trim()) playMagnet(e.target.value.trim()) })

  loadList('/api/tmdb/trending', 'Trending this week')
</script>
</body>
</html>
